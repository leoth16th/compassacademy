name: publish-cycle

'on':
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r senders/requirements.txt

      - name: Send anything due
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
        run: python senders/dispatch_due.py --tz Asia/Tehran

      - name: Commit updated state
        run: |
          git config user.name "compass-bot"
          git config user.email "bot@compassenglish.ir"
          git add control.db cycle/
          git diff --quiet --cached || git commit -m "chore: mark due items posted [skip ci]"
          git push
