name: publish-cycle

'on':
  # Once-daily dispatch at ~08:07 Tehran (04:37 UTC). GHA's scheduler
  # silently skipped the 2026-09-19 run entirely (confirmed via gh run
  # list: zero runs that day, no error). Tried 3x/hour as a safety net on
  # 2026-09-19 but that's wasteful (extra GHA minutes + carbon for no real
  # benefit) and Mike vetoed it - going back to once/day. Using :37 instead
  # of :30 since GHA's scheduler queues/drops more often at the exact
  # top/bottom of the hour when every other repo on Earth also fires then;
  # off-beat minutes are documented to be more reliable. If a run is still
  # silently skipped, see MUST_READ notes / revisit an external cron
  # trigger (cPanel host has cron but no SSH/Python - would need a tiny
  # PHP webhook-ping script, deferred until we see how this performs).
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r senders/requirements.txt

      - name: Send anything due
        env:
          TELEGRAM_BOT_TOKEN_1: ${{ secrets.TELEGRAM_BOT_TOKEN_1 }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
        run: python senders/dispatch_due.py --tz Asia/Tehran

      - name: Commit updated state
        run: |
          git config user.name "compass-bot"
          git config user.email "bot@compassenglish.ir"
          git add control.db cycle/
          if ! git diff --quiet --cached; then
            git commit -m "chore: mark due items posted [skip ci]"
          fi

      - name: Push commits (fail job if push fails and there were changes)
        run: |
          git config user.name "compass-bot"
          git config user.email "bot@compassenglish.ir"
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          # Check if there are commits to push (compare HEAD with remote)
          if git rev-parse --verify origin/$CURRENT_BRANCH >/dev/null 2>&1; then
            LOCAL=$(git rev-parse HEAD)
            REMOTE=$(git rev-parse origin/$CURRENT_BRANCH)
            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "Local commits ahead of remote — pushing..."
              git push
              echo "✅ Push succeeded"
            else
              echo "No local commits to push (already in sync)"
            fi
          else
            echo "No upstream branch — pushing to establish tracking"
            git push -u origin $CURRENT_BRANCH
            echo "✅ Push succeeded"
          fi
