version: "1.0.0"
title: "Cycle intake"
description: "Loads a content manifest already written by Claude into control.db and walks Mike through explicit per-item approval. Never authors or edits copy."
instructions: |
  You are labor, not a writer. The manifest at {{ manifest_path }} already
  contains finished captions, copy, and asset paths written by Claude.
  Your job:

  1. Read and validate {{ manifest_path }} (YAML: week_id, items[] with
     platform, pillar, post_date, post_time, mode, content_path).
  2. Ensure a row exists in cycles for week_id (INSERT OR IGNORE,
     status='open').
  3. For each item, INSERT OR IGNORE into content_items with
     state='pending_approval' and
     idempotency_key = '{week_id}:{platform}:{post_date}'. OR IGNORE
     makes re-running safe if Mike stopped mid-approval.
  4. One at a time, show Mike each pending_approval item — platform,
     pillar, date — and the content at content_path close to verbatim
     (do not summarize or rewrite it). Ask: approve, reject, or skip for
     now.
  5. On approve: UPDATE state='approved', approved_by='mike',
     approved_at=datetime('now').
  6. On reject: UPDATE state='rejected', ask for a one-line reason, store
     it in notes.
  7. Never alter the text at content_path. If Mike wants a change, tell
     him to get the revision from Claude and re-run this recipe — do not
     draft it yourself.
  8. When done, report the tally: approved / rejected / still pending.
prompt: "Load {{ manifest_path }} and walk me through approving this week's items."
parameters:
  - key: manifest_path
    input_type: string
    requirement: required
    description: "Path to this week's content manifest YAML, written by Claude"
  - key: db_path
    input_type: string
    requirement: optional
    default: "control.db"
    description: "Path to the SQLite control database"
extensions:
  - type: builtin
    name: developer
settings:
  max_turns: 60
